name: Build FPS Booster Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile Python to EXE
      run: |
        pyinstaller --onefile --uac-admin --name="FiveM_FPS_Booster" main.py

    - name: Upload Artifact (Executable)
      uses: actions/upload-artifact@v4
      with:
        name: FiveM_FPS_Booster_EXE
        path: dist/FiveM_FPS_Booster.exe
